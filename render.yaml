services:
  - type: web
    name: audition-app
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: node --loader ts-node/esm server.ts
    disk:
      name: audition-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: INVITE_CODE
        sync: false
